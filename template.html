<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Dashboard</title>
<style>
:root{
  --bg:#0e1116; --card:#161b22; --line:#242c37; --fg:#e6edf3;
  --dim:#8b949e; --accent:#58a6ff; --radius:12px; --live:#f85149;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f8fa;--card:#fff;--line:#d8dee4;--fg:#1f2328;--dim:#656d76;--accent:#0969da;--live:#cf222e;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
     min-height:100vh;display:flex;flex-direction:column;}

header{padding:24px 24px 8px;max-width:900px;margin:0 auto;width:100%}
.top{display:flex;align-items:baseline;gap:12px}
h1{margin:0;font-size:20px;letter-spacing:-.02em}
.stamp{color:var(--dim);font-size:12px;margin-top:2px}

nav{display:flex;align-items:center;gap:10px;margin-top:16px;
    padding:0 24px;max-width:900px;margin-left:auto;margin-right:auto;width:100%}
nav button{
  background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;
  font-family:inherit;
}
nav button:hover{border-color:var(--accent);color:var(--accent)}
nav button:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--dim)}
nav .indicator{margin-left:auto;color:var(--dim);font-size:12px;
               font-variant-numeric:tabular-nums}

main{flex:1;display:flex;justify-content:center;padding:16px 24px 48px;
     width:100%;max-width:900px;margin:0 auto;align-items:flex-start}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:18px 20px 12px;width:100%;overflow:hidden}
.card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;
         color:var(--fg);font-weight:600;display:flex;gap:8px;align-items:center}
.card h2 .count{margin-left:auto;font-weight:400;opacity:.5;font-size:12px}

.score{background:rgba(88,166,255,.08);border:1px solid var(--line);border-radius:8px;
       padding:10px 12px;margin-bottom:12px;font-size:13px}
.score.live{border-color:var(--live)}
.score .tag{color:var(--live);font-weight:600;font-size:11px;letter-spacing:.05em;
            text-transform:uppercase;margin-right:8px}
.score .next-tag{color:var(--accent);font-weight:600;font-size:11px;
                 letter-spacing:.05em;text-transform:uppercase;margin-right:8px}

ul{list-style:none;margin:0;padding:0}
li{padding:11px 0;border-top:1px solid var(--line)}
li:first-child{border-top:none}
a{color:var(--fg);text-decoration:none}
a:hover{color:var(--accent)}
.t{font-weight:500;display:block;font-size:15px}
.m{color:var(--dim);font-size:12px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.s{color:var(--dim);font-size:13px;margin-top:5px;display:-webkit-box;
   -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--dim);font-size:13px;padding:12px 0}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title"></h1>
    <span class="stamp" id="stamp"></span>
  </div>
</header>
<nav>
  <button id="prev" aria-label="Previous section">← Prev</button>
  <button id="next" aria-label="Next section">Next →</button>
  <span class="indicator" id="indicator"></span>
</nav>
<main id="main"></main>

<script>
window.__DASHBOARD_DATA__ = window.__DASHBOARD_DATA__ || { title: "", generated: "", sections: [] };
const DATA = window.__DASHBOARD_DATA__;

const esc = s => (s||'')
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  .replace(/`/g, '&#96;')
  .replace(/[\u200B-\u200D\u2028\u2029]/g, '');

function rel(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const mins = (Date.now() - d) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + 'm ago';
  if (mins < 1440) return Math.round(mins/60) + 'h ago';
  return Math.round(mins/1440) + 'd ago';
}

function fmtGameDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const opts = { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' };
  return d.toLocaleString(undefined, opts);
}

function renderScore(game){
  if(!game) return '';
  if(game.status === 'live'){
    return `
      <div class="score live">
        <span class="tag">Live</span>${esc(game.detail || '')}
      </div>`;
  }
  if(game.status === 'scheduled'){
    return `
      <div class="score">
        <span class="next-tag">Next</span>${esc(game.detail || '')}
        <div style="color:var(--dim);font-size:12px;margin-top:3px">${esc(fmtGameDate(game.date))}</div>
      </div>`;
  }
  return '';
}

function renderSection(sec){
  return `
    <section class="card">
      <h2>${sec.icon ? esc(sec.icon) + ' ' : ''}${esc(sec.name)}<span class="count">${sec.items.length}</span></h2>
      ${renderScore(sec.game)}
      <ul>${sec.items.length ? sec.items.map(it => `
        <li>
          <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>
          ${it.summary ? `<div class="s">${esc(it.summary)}</div>` : ''}
          <div class="m">${it.source ? `<span>${esc(it.source)}</span>` : ''}${it.published ? `<span>${esc(rel(it.published))}</span>` : ''}</div>
        </li>`).join('') : '<li class="empty">No items</li>'}
      </ul>
    </section>`;
}

let current = 0;
const total = DATA.sections.length;

document.getElementById('title').textContent = DATA.title;
document.getElementById('stamp').textContent = 'Updated ' + DATA.generated;

const main = document.getElementById('main');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const indicator = document.getElementById('indicator');

function slugify(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function updateURL(){
  if(DATA.sections[current]){
    history.replaceState(null, '', '#' + slugify(DATA.sections[current].name));
  }
}

function show(i){
  if(i < 0 || i >= total) return;
  current = i;
  main.innerHTML = renderSection(DATA.sections[current]);
  indicator.textContent = `${current + 1} / ${total}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
  updateURL();
  window.scrollTo(0, 0);
}

prevBtn.addEventListener('click', () => show(current - 1));
nextBtn.addEventListener('click', () => show(current + 1));

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft')  show(current - 1);
  if(e.key === 'ArrowRight') show(current + 1);
});

const hash = window.location.hash.replace('#', '');
if(hash){
  const idx = DATA.sections.findIndex(s => slugify(s.name) === hash);
  show(idx >= 0 ? idx : 0);
} else {
  show(0);
}
</script>
</body>
</html>
